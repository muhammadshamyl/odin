[project]
name = "odin"
version = "0.1.0"
description = "Autonomous pipeline infrastructure — Slice 1: CSV/TXT ingestion"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
]

[project.scripts]
odin = "odin.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
